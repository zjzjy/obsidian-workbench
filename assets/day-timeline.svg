<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-label="跟着我过一天：Obsidian 工作台的一天">
  <defs>
    <style>
      .ink { fill:#2F2A25; }
      .muted { fill:#7E7469; }
      .accent { fill:#B85C38; }
      .green { fill:#5F7A5A; }
      .blue { fill:#557383; }
      .gold { fill:#8A6A18; }
      .card { fill:#FFFFFF; stroke:#E6DCCF; stroke-width:1.2; }
      .soft-accent { fill:#F6E7DD; }
      .soft-green { fill:#E9EFE4; }
      .soft-blue { fill:#E5EDF1; }
      .soft-gold { fill:#F5EEDB; }
      .body { font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; font-weight:400; }
      .title { font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; font-weight:700; }
      .mono { font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace; font-weight:500; }
    </style>
  </defs>

  <rect width="900" height="1120" fill="#FAF7F2"/>
  <circle cx="850" cy="70" r="120" fill="#F2E9DC" opacity="0.6"/>

  <text x="40" y="56" class="title ink" font-size="34">跟着我过一天</text>
  <text x="42" y="86" class="body muted" font-size="17">五个小动作，覆盖「捕获 → 加工 → 回看」</text>
  <text x="42" y="110" class="body muted" font-size="15">每一步只做一件小事，不需要先想「这东西放哪」。</text>
  <line x1="40" y1="128" x2="860" y2="128" stroke="#E2D8CB" stroke-width="1"/>

  <line x1="150" y1="160" x2="150" y2="1000" stroke="#D8CCBD" stroke-width="2"/>

  <!-- 08:00 -->
  <text x="128" y="186" text-anchor="end" class="title accent" font-size="17">08:00</text>
  <circle cx="150" cy="180" r="8" fill="#B85C38" stroke="#FAF7F2" stroke-width="4"/>
  <rect x="180" y="150" width="680" height="140" rx="14" class="card"/>
  <text x="204" y="184" class="title ink" font-size="22">打开今天，直接写</text>
  <text x="204" y="214" class="body muted" font-size="15">七节骨架已经建好，直接写，不用起标题</text>
  <text x="204" y="238" class="body muted" font-size="15">今日打卡 / 发生 / 感悟 / 灵感 / 明天 / 待抓取 / 随记</text>
  <rect x="204" y="252" width="82" height="22" rx="11" class="soft-accent"/>
  <text x="214" y="268" class="mono accent" font-size="11">Templater</text>
  <rect x="292" y="252" width="62" height="22" rx="11" class="soft-accent"/>
  <text x="302" y="268" class="mono accent" font-size="11">Dayline</text>
  <rect x="360" y="252" width="78" height="22" rx="11" class="soft-accent"/>
  <text x="370" y="268" class="mono accent" font-size="11">Homepage</text>

  <!-- 10:00 -->
  <text x="128" y="356" text-anchor="end" class="title accent" font-size="17">10:00</text>
  <circle cx="150" cy="350" r="8" fill="#5F7A5A" stroke="#FAF7F2" stroke-width="4"/>
  <rect x="180" y="320" width="680" height="140" rx="14" class="card"/>
  <text x="204" y="354" class="title ink" font-size="22">微信发给自己</text>
  <text x="204" y="384" class="body muted" font-size="15">文字 / 图片 / 语音 / 链接，自动落到当天日记</text>
  <text x="204" y="408" class="body muted" font-size="15">带链接的进「待抓取」，图片和文件先进中转区</text>
  <rect x="204" y="422" width="92" height="22" rx="11" class="soft-green"/>
  <text x="214" y="438" class="mono green" font-size="11">WeChat2Ob</text>

  <!-- 14:00 -->
  <text x="128" y="526" text-anchor="end" class="title accent" font-size="17">14:00</text>
  <circle cx="150" cy="520" r="8" fill="#557383" stroke="#FAF7F2" stroke-width="4"/>
  <rect x="180" y="490" width="680" height="140" rx="14" class="card"/>
  <text x="204" y="524" class="title ink" font-size="22">长文丢给 AI</text>
  <text x="204" y="554" class="body muted" font-size="15">网页 / B站 / 小红书，抓成一篇 Markdown 长文稿</text>
  <text x="204" y="578" class="body muted" font-size="15">带 frontmatter 和默认折叠的 AI 导读，先看导读再展开</text>
  <rect x="204" y="592" width="138" height="22" rx="11" class="soft-blue"/>
  <text x="214" y="608" class="mono blue" font-size="11">universal-extractor</text>

  <!-- 22:30 -->
  <text x="128" y="696" text-anchor="end" class="title accent" font-size="17">22:30</text>
  <circle cx="150" cy="690" r="8" fill="#B85C38" stroke="#FAF7F2" stroke-width="4"/>
  <rect x="180" y="660" width="680" height="140" rx="14" class="card"/>
  <text x="204" y="694" class="title ink" font-size="22">说一句「加工今天」</text>
  <text x="204" y="724" class="body muted" font-size="15">归位 · 补字段 · 写一句话 · 抽双链 · Inbox 归零</text>
  <text x="204" y="748" class="body muted" font-size="15">不改正文：不去口癖、不断句、不调语序、不替人分节</text>
  <rect x="204" y="762" width="72" height="22" rx="11" class="soft-accent"/>
  <text x="214" y="778" class="mono accent" font-size="11">Claudian</text>
  <rect x="282" y="762" width="76" height="22" rx="11" class="soft-accent"/>
  <text x="292" y="778" class="mono accent" font-size="11">Dataview</text>

  <!-- next morning -->
  <text x="128" y="856" text-anchor="end" class="title accent" font-size="16">次日 09:00</text>
  <circle cx="150" cy="850" r="8" fill="#C9A227" stroke="#FAF7F2" stroke-width="4"/>
  <rect x="180" y="820" width="680" height="140" rx="14" class="card"/>
  <text x="204" y="854" class="title ink" font-size="22">打开 Home，昨天还在</text>
  <text x="204" y="884" class="body muted" font-size="15">昨天的一句话、待办、图；今年 / 这个月过了多少</text>
  <text x="204" y="908" class="body muted" font-size="15">点 Dayline：日历缩略图、心情色点、时间线、去年今日</text>
  <rect x="204" y="922" width="78" height="22" rx="11" class="soft-gold"/>
  <text x="214" y="938" class="mono gold" font-size="11">Homepage</text>
  <rect x="288" y="922" width="62" height="22" rx="11" class="soft-gold"/>
  <text x="298" y="938" class="mono gold" font-size="11">Dayline</text>

  <rect x="40" y="1008" width="820" height="78" rx="14" fill="#FFFFFF" stroke="#E6DCCF"/>
  <text x="64" y="1038" class="title ink" font-size="16">周日：顺手复盘</text>
  <text x="64" y="1064" class="body muted" font-size="14">点 Calendar 的周数 → 生成周记；月度任务里看习惯格子和「完整打卡」。</text>
  <rect x="620" y="1040" width="70" height="22" rx="11" class="soft-blue"/>
  <text x="630" y="1056" class="mono blue" font-size="11">Calendar</text>
  <rect x="696" y="1040" width="54" height="22" rx="11" class="soft-blue"/>
  <text x="706" y="1056" class="mono blue" font-size="11">Tasks</text>
  <rect x="756" y="1040" width="86" height="22" rx="11" class="soft-blue"/>
  <text x="766" y="1056" class="mono blue" font-size="11">打卡 tracker</text>
</svg>
